<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b4e">
  <title>Maison d’Imprimeur — نموذج تجريبي</title>
  <style>
    :root{--navy:#102b4e;--blue:#2459a6;--gold:#e5ad45;--bg:#f4f6fa;--ink:#17243a;--muted:#758198;--line:#e7ebf2;--white:#fff;--green:#16845b;--red:#c24747;--shadow:0 12px 30px rgba(27,48,82,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
    aside{background:var(--navy);color:#fff;padding:22px 15px;display:flex;flex-direction:column;gap:25px}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;border-bottom:1px solid #ffffff20}.logo{width:43px;height:43px;border-radius:13px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:23px;font-weight:bold}.brand strong{display:block;font-size:15px}.brand small{display:block;color:#bdc9dc;margin-top:5px}.nav-label{font-size:11px;color:#91a4c0;padding:0 12px;margin:0 0 7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d4deed;text-align:start;padding:12px;border-radius:10px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#ffffff17;color:#fff}.nav .icon{width:20px;text-align:center;font-size:17px}.aside-bottom{margin-top:auto;color:#aab8ce;font-size:12px;line-height:1.8;padding:10px}
    main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px}.crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:12px}.lang,.user{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;color:var(--ink)}.user{display:flex;align-items:center;gap:9px}.avatar{width:30px;height:30px;border-radius:50%;background:#e8effb;color:var(--blue);display:grid;place-items:center;font-weight:bold}.content{max-width:1450px;margin:auto;padding:28px 30px 45px}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px;gap:14px}.welcome h1{font-size:24px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0;font-size:14px}.primary{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:11px 16px;font-weight:600;box-shadow:0 5px 12px #2459a633}.primary:hover{background:#194987}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.stat-icon{width:36px;height:36px;border-radius:11px;background:#edf3fd;display:grid;place-items:center;font-size:18px}.stat strong{font-size:24px;display:block;margin:13px 0 5px}.stat small{color:var(--muted)}.positive{color:var(--green)!important}.grid-2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.section{padding:19px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-title h2{font-size:16px;margin:0}.text-button{border:0;background:transparent;color:var(--blue);font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:start;color:var(--muted);font-weight:500;padding:10px 9px;border-bottom:1px solid var(--line)}td{padding:13px 9px;border-bottom:1px solid #f0f2f6}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf3fd;color:#28599e;font-size:11px}.badge.green{background:#e7f6ef;color:#16845b}.badge.orange{background:#fff3dc;color:#a66a00}.badge.red{background:#fdecec;color:#b43e3e}.activity{display:grid;gap:15px}.activity-item{display:flex;gap:11px;align-items:flex-start;font-size:13px}.activity-icon{flex:0 0 33px;height:33px;border-radius:10px;background:#f0f4fb;display:grid;place-items:center}.activity-item p{margin:1px 0 5px}.activity-item small{color:var(--muted)}.subhead{color:var(--muted);font-size:13px;margin:0 0 14px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:220px;background:#fff}.select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;color:var(--ink)}.page-card{padding:20px}.empty-note{padding:30px;text-align:center;color:var(--muted)}.demo-note{margin-top:20px;border:1px dashed #cbd6e6;background:#f9fbfe;color:#65728a;border-radius:12px;padding:13px 15px;font-size:12px;line-height:1.7}.footer{margin-top:23px;text-align:center;color:#8b96a8;font-size:11px}.mobile-menu{display:none;border:0;background:transparent;font-size:22px;color:var(--navy)}
    @media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.app{grid-template-columns:220px minmax(0,1fr)}}
    @media(max-width:700px){.app{display:block}aside{display:none;position:fixed;z-index:5;inset:0 auto 0 0;width:260px;box-shadow:0 0 0 100vw #101c2c66}.app.menu-open aside{display:flex}.topbar{height:64px;padding:0 15px}.mobile-menu{display:block}.crumb{display:none}.content{padding:22px 15px}.welcome{align-items:flex-start}.welcome h1{font-size:21px}.welcome .primary{padding:10px;font-size:12px}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:20px}.top-actions{gap:7px}.user{padding:5px 8px}.user span:last-child{display:none}}
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside>
      <div class="brand"><div class="logo">م</div><div><strong>Maison d’Imprimeur</strong><small id="brand-sub">تسيير المحل</small></div></div>
      <div><p class="nav-label" id="menu-label">القائمة الرئيسية</p><nav class="nav" id="nav"></nav></div>
      <div class="aside-bottom" id="aside-note">نسخة عرض تجريبية<br>معلومات وهمية للتوضيح فقط</div>
    </aside>
    <main>
      <header class="topbar"><div class="top-actions"><button class="mobile-menu" id="mobile-menu" aria-label="Menu">☰</button><span class="crumb" id="crumb">الرئيسية / لوحة القيادة</span></div><div class="top-actions"><button class="lang" id="language">FR</button><button class="user"><span class="avatar">م</span><span id="user-label">المدير</span></button></div></header>
      <div class="content" id="content"></div>
    </main>
  </div>
<script>
  const icons={dashboard:'▦',orders:'▤',clients:'♙',stock:'▣',cash:'◉',invoices:'▧',reports:'▥',settings:'⚙'};
  const dict={
    ar:{brandSub:'تسيير المحل',menu:'القائمة الرئيسية',aside:'نسخة عرض تجريبية<br>معلومات وهمية للتوضيح فقط',manager:'المدير',crumb:'الرئيسية',items:[['dashboard','لوحة القيادة'],['orders','الطلبات'],['clients','الزبناء'],['stock','المخزون'],['cash','الصندوق'],['invoices','الفواتير والوصولات'],['reports','التقارير'],['settings','الإعدادات']],hello:'السلام عليكم، مرحباً بك',welcome:'ها هي نظرة سريعة على النشاط ديال المحل اليوم.',newOrder:'+ طلب جديد',stats:[['مبيعات اليوم','1 850 د.م','↑ 12% مقارنة بالبارح','▤'],['طلبات قيد الإنجاز','12','4 مستعجلة','◷'],['مخزون منخفض','3','خاص إعادة التزويد','▣'],['مصاريف اليوم','320 د.م','مصاريف مسجلة اليوم','↘']],recent:'آخر الطلبات',viewAll:'عرض الكل',columns:['رقم الطلب','الزبون','الخدمة','المبلغ','الحالة'],activity:'آخر النشاطات',activities:[['🧾','تم تسجيل أداء وصل رقم #R-1048','منذ 10 دقائق'],['📦','تمت إضافة ورق A4 للمخزون','منذ 35 دقيقة'],['🖨️','الطلب #C-2081 جاهز للتسليم','منذ ساعة']],rows:[['#C-2084','فاطمة الزهراء','طباعة وثائق','120 د.م','جديد','blue'],['#C-2083','محمد العلوي','ترجمة','450 د.م','قيد الإنجاز','orange'],['#C-2082','سعيد بنعمر','لوازم مكتبية','280 د.م','جاهز','green'],['#C-2081','نادية الإدريسي','طباعة ونسخ','75 د.م','جاهز','green']],demo:'ملاحظة: هاد الواجهة غير نموذج للعرض؛ الأرقام والطلبات تجريبية. الأزرار ما كتسجلش بيانات حقيقية.',titles:{orders:'الطلبات',clients:'الزبناء',stock:'المخزون',cash:'الصندوق',invoices:'الفواتير والوصولات',reports:'التقارير',settings:'الإعدادات'},descs:{orders:'تتبع طلبات الطباعة والترجمة والخدمات الأخرى.',clients:'لائحة الزبناء وسجل الخدمات ديالهم.',stock:'مراقبة المنتجات والكميات والتنبيهات.',cash:'تسجيل المداخيل والمصاريف اليومية.',invoices:'إصدار وتتبع الفواتير والوصولات.',reports:'ملخص المبيعات والمصاريف حسب الفترة.',settings:'إعدادات المحل واللغة والمستخدمين.'},search:'بحث...',filter:'كل الحالات',empty:'هنا غادي تبان المعلومات ملي يتبنى النظام الحقيقي.',period:'هاد الشهر',income:'المداخيل',expenses:'المصاريف',net:'الصافي',save:'حفظ الإعدادات',logo:'شعار الشركة',langSetting:'لغة الواجهة',users:'المستخدمون',access:'الصلاحيات',roles:'Admin، Manager، Employé'},
    fr:{brandSub:'Gestion du magasin',menu:'MENU PRINCIPAL',aside:'Prototype de présentation<br>Données fictives uniquement',manager:'Manager',crumb:'Accueil',items:[['dashboard','Tableau de bord'],['orders','Commandes'],['clients','Clients'],['stock','Stock'],['cash','Caisse'],['invoices','Factures et reçus'],['reports','Rapports'],['settings','Paramètres']],hello:'Bonjour, bienvenue',welcome:'Voici un aperçu rapide de l’activité du magasin aujourd’hui.',newOrder:'+ Nouvelle commande',stats:[['Ventes du jour','1 850 MAD','↑ 12 % par rapport à hier','▤'],['Commandes en cours','12','4 urgentes','◷'],['Stock faible','3','À réapprovisionner','▣'],['Dépenses du jour','320 MAD','Dépenses enregistrées aujourd’hui','↘']],recent:'Dernières commandes',viewAll:'Tout voir',columns:['N° commande','Client','Service','Montant','Statut'],activity:'Activité récente',activities:[['🧾','Paiement reçu enregistré #R-1048','Il y a 10 minutes'],['📦','Papier A4 ajouté au stock','Il y a 35 minutes'],['🖨️','La commande #C-2081 est prête','Il y a 1 heure']],rows:[['#C-2084','Fatima Zahra','Impression documents','120 MAD','Nouvelle','blue'],['#C-2083','Mohamed Alaoui','Traduction','450 MAD','En cours','orange'],['#C-2082','Saïd Bennani','Fournitures bureau','280 MAD','Prête','green'],['#C-2081','Nadia Idrissi','Impression et copies','75 MAD','Prête','green']],demo:'Note : cette interface est une maquette de présentation ; les chiffres et commandes sont fictifs. Les boutons n’enregistrent aucune donnée réelle.',titles:{orders:'Commandes',clients:'Clients',stock:'Stock',cash:'Caisse',invoices:'Factures et reçus',reports:'Rapports',settings:'Paramètres'},descs:{orders:'Suivez les commandes d’impression, de traduction et les autres services.',clients:'Liste des clients et historique de leurs prestations.',stock:'Suivez les articles, les quantités et les alertes.',cash:'Enregistrez les recettes et dépenses quotidiennes.',invoices:'Créez et suivez les factures et reçus.',reports:'Consultez les ventes et dépenses par période.',settings:'Paramètres du magasin, langue et utilisateurs.'},search:'Rechercher...',filter:'Tous les statuts',empty:'Les données apparaîtront ici dans l’application réelle.',period:'Ce mois',income:'Recettes',expenses:'Dépenses',net:'Net',save:'Enregistrer les paramètres',logo:'Logo de l’entreprise',langSetting:'Langue de l’interface',users:'Utilisateurs',access:'Autorisations',roles:'Admin, Manager, Employé'}
  };
  let lang='ar',page='dashboard';
  const nav=document.getElementById('nav'),content=document.getElementById('content');
  function render(){const t=dict[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('brand-sub').textContent=t.brandSub;document.getElementById('menu-label').textContent=t.menu;document.getElementById('aside-note').innerHTML=t.aside;document.getElementById('user-label').textContent=t.manager;document.getElementById('language').textContent=lang==='ar'?'FR':'عربي';document.getElementById('crumb').textContent=`${t.crumb} / ${page==='dashboard'?t.items[0][1]:(t.titles[page]||'')}`;
    nav.innerHTML=t.items.map(([id,label])=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="icon">${icons[id]}</span>${label}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.getElementById('app').classList.remove('menu-open');render()});
    if(page==='dashboard'){content.innerHTML=`<div class="welcome"><div><h1>${t.hello}</h1><p>${t.welcome}</p></div><button class="primary" onclick="openPage('orders')">${t.newOrder}</button></div><section class="stats">${t.stats.map(s=>`<article class="card stat"><div class="stat-head"><span>${s[0]}</span><span class="stat-icon">${s[3]}</span></div><strong>${s[1]}</strong><small class="${s[2].startsWith('↑')?'positive':''}">${s[2]}</small></article>`).join('')}</section><section class="grid-2"><article class="card section"><div class="section-title"><h2>${t.recent}</h2><button class="text-button" onclick="openPage('orders')">${t.viewAll} ←</button></div><div class="table-wrap"><table><thead><tr>${t.columns.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.slice(0,4).map(x=>`<td>${x}</td>`).join('')}<td><span class="badge ${r[5]}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div></article><article class="card section"><div class="section-title"><h2>${t.activity}</h2><span class="badge">●</span></div><div class="activity">${t.activities.map(a=>`<div class="activity-item"><span class="activity-icon">${a[0]}</span><div><p>${a[1]}</p><small>${a[2]}</small></div></div>`).join('')}</div></article></section><div class="demo-note">${t.demo}</div><div class="footer">Maison d’Imprimeur · Béni Mellal · Prototype</div>`}
    else{let title=t.titles[page]||t.items[0][1];let extra=page==='settings'?`<div class="toolbar"><label>${t.langSetting}</label><select class="select"><option>العربية</option><option>Français</option></select></div><div class="toolbar"><label>${t.logo}</label><button class="select">${lang==='ar'?'اختيار ملف':'Choisir un fichier'}</button></div><div class="toolbar"><label>${t.users}</label><span class="badge">10 ${lang==='ar'?'حسابات كحد أقصى':'comptes maximum'}</span></div><div class="toolbar"><label>${t.access}</label><span class="subhead">${t.roles}</span></div><button class="primary">${t.save}</button>`:`<div class="toolbar"><input class="search" placeholder="${t.search}"><select class="select"><option>${t.filter}</option></select><button class="primary">${lang==='ar'?'+ إضافة':' + Ajouter'}</button></div><div class="empty-note">${t.empty}</div>`;content.innerHTML=`<div class="welcome"><div><h1>${title}</h1><p>${t.descs[page]||''}</p></div></div><section class="card page-card"><p class="subhead">${title}</p>${extra}</section><div class="demo-note">${t.demo}</div><div class="footer">Maison d’Imprimeur · Béni Mellal · Prototype</div>`}
  }
  window.openPage=(p)=>{page=p;render()};document.getElementById('language').onclick=()=>{lang=lang==='ar'?'fr':'ar';render()};document.getElementById('mobile-menu').onclick=()=>document.getElementById('app').classList.toggle('menu-open');render();
</script>
</body>
</html>
